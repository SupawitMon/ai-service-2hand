server {
    listen 80;
    client_max_body_size 20m;   # รูปสินค้าไฟล์ใหญ่ได้ถึง 20MB

    root /usr/share/nginx/html;
    index mockup_ai_price.html;

    # หน้าเว็บ: /  = ประเมินราคา,  /negotiation_chatbot.html = แชทบอทเจรจา
    location / {
        try_files $uri $uri/ /mockup_ai_price.html;
    }

    # แชทบอทถาม-ตอบ -> container chatbot
    location /api/chat {
        proxy_pass http://chatbot:5001;
        proxy_set_header Host $host;
    }

    # API ประเมินราคา/เกรด -> container backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # หน้า Swagger ของ backend ราคา (Swagger ของแชทบอทเปิดที่ :5001/apidocs)
    location ~ ^/(apidocs|apispec|flasgger_static) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }
}

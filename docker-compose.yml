services:
  backend:
    build: .
    container_name: ai-price-backend
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
    expose:
      - "5000"               # ใช้ภายใน — เรียกจากข้างนอกผ่าน nginx ที่พอร์ต 8012
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    container_name: ai-chatbot
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
      - FALLBACK_THRESHOLD=0.25        # ความมั่นใจต่ำกว่านี้ = ไม่ตอบ แล้วถามกลับ
      - SESSION_TTL_SEC=1800           # จำบริบทการคุย 30 นาที
      - LOG_RETENTION_DAYS=30          # เก็บ log ย้อนหลัง 30 วัน (หมุนไฟล์ทุกเที่ยงคืน)
      - LOG_ACCESS_TOKEN=${LOG_ACCESS_TOKEN:-}   # ตั้งใน .env เพื่อเปิด GET /api/logs/<request_id>
    volumes:
      - ./logs:/app/logs
    ports:
      - "8013:5001"          # แชทบอทโดยตรง + Swagger: http://<IP>:8013/apidocs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: nginx:alpine
    container_name: ai-frontend
    restart: unless-stopped
    ports:
      - "8012:80"            # หน้าเว็บ + API ทั้งหมด: http://<IP>:8012
    volumes:
      - ./mockup_ai_price.html:/usr/share/nginx/html/mockup_ai_price.html:ro
      - ./negotiation_chatbot.html:/usr/share/nginx/html/negotiation_chatbot.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - chatbot

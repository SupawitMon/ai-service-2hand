services:
  backend:
    build: .
    container_name: ai-price-backend
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
    expose:
      - "5000"               # ใช้ภายใน — เรียกจากข้างนอกผ่าน nginx ที่พอร์ต 8012
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    container_name: ai-chatbot
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
    ports:
      - "8013:5001"          # แชทบอทโดยตรง + Swagger: http://<IP>:8013/apidocs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: nginx:alpine
    container_name: ai-frontend
    restart: unless-stopped
    ports:
      - "8012:80"            # หน้าเว็บ + API ทั้งหมด: http://<IP>:8012
    volumes:
      - ./mockup_ai_price.html:/usr/share/nginx/html/mockup_ai_price.html:ro
      - ./negotiation_chatbot.html:/usr/share/nginx/html/negotiation_chatbot.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - chatbot

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI ช่วยเจรจาต่อรองราคา — ตลาดมือสอง</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F5; --ink:#1C2321; --soft:#6B7572; --line:#E3E7E5; --white:#fff;
    --buy:#0F7A52; --buy-soft:#E8F5EF; --buy-line:#BFE3D2;
    --sell:#5B3E9C; --sell-soft:#F0EBFA; --sell-line:#D6C9F0;
    --warn:#B8860B; --warn-soft:#FDF6E3; --danger:#B3452F; --danger-soft:#FBEDE9;
    --info:#2563A8; --info-soft:#EAF2FB;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  .wrap{max-width:1500px;margin:0 auto;padding:14px 18px 24px;}

  /* ---------- แถบเลือกสินค้า ---------- */
  .picker-label{font-size:12px;color:var(--soft);margin-bottom:4px;}
  select#productSelect{
    width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:14.5px;font-weight:600;background:var(--white);outline:none;
  }
  select#productSelect:focus{border-color:var(--buy);}
  .seller-line{font-size:12.5px;color:var(--soft);margin:8px 2px 14px;}
  .seller-line b{color:var(--ink);}
  .seller-line .floor{color:var(--danger);font-weight:700;}

  /* ---------- 2 แผง ---------- */
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:980px){ .panels{grid-template-columns:1fr;} }
  .panel{background:var(--white);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:560px;overflow:hidden;}
  .panel-head{padding:12px 16px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .panel.buyer .panel-head{background:var(--buy-soft);color:var(--buy);border-bottom:1px solid var(--buy-line);}
  .panel.seller .panel-head{background:var(--sell-soft);color:var(--sell);border-bottom:1px solid var(--sell-line);}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}

  .thread{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}

  .msg{max-width:82%;padding:9px 13px;border-radius:14px;line-height:1.55;font-size:13.5px;white-space:pre-wrap;word-break:break-word;}
  .msg.from-seller{align-self:flex-start;background:#EFEDE9;border-bottom-left-radius:4px;}
  .msg.from-buyer{align-self:flex-end;background:var(--buy);color:#fff;border-bottom-right-radius:4px;}

  /* การ์ดข้อมูลจริงจาก dataset */
  .card{
    align-self:flex-start;max-width:88%;background:var(--white);border:1px solid var(--buy-line);
    border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.6;
  }
  .card .tag{
    display:inline-block;background:var(--buy-soft);color:var(--buy);font-weight:700;
    font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:6px;
  }
  .card b{color:var(--ink);}

  /* กล่อง AI โค้ชผู้ซื้อ */
  .coach{
    align-self:stretch;background:var(--info-soft);border:1px solid #C9DDF3;border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:var(--info);line-height:1.5;
  }

  /* กล่อง AI แนะนำผู้ขาย */
  .advisor{
    align-self:stretch;background:var(--white);border:1px solid var(--sell-line);
    border-radius:12px;padding:12px 14px;
  }
  .advisor .tag{
    display:inline-block;background:var(--sell-soft);color:var(--sell);font-weight:700;
    font-size:11px;padding:2px 9px;border-radius:999px;margin-bottom:10px;
  }
  .nums{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .num{font-size:11px;color:var(--soft);}
  .num b{display:block;font-size:15px;color:var(--ink);margin-top:1px;}
  .num.mid{text-align:center;} .num.right{text-align:right;}
  .bar{height:9px;border-radius:999px;position:relative;margin:4px 0 3px;
       background:linear-gradient(90deg,#E06A4E 0%,#E7B23C 45%,#3FA06E 78%,#2E8B57 100%);}
  .bar .marker{
    position:absolute;top:-4px;width:4px;height:17px;border-radius:2px;background:var(--sell);
    box-shadow:0 0 0 2px #fff;transform:translateX(-2px);
  }
  .zones{display:flex;justify-content:space-between;font-size:10.5px;color:var(--soft);margin-bottom:9px;}
  .verdict{font-size:12.5px;line-height:1.5;margin-bottom:10px;}
  .acts{display:flex;gap:7px;}
  .acts button{
    flex:1;padding:8px 6px;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--soft);transition:.15s;
  }
  .acts button:hover{border-color:var(--sell);color:var(--sell);}
  .acts button.primary{background:var(--sell);border-color:var(--sell);color:#fff;}
  .acts button.primary:hover{background:#4A3184;}
  .acts button.rec{position:relative;border-color:var(--sell-line);color:var(--sell);}
  .advisor.spent{opacity:.62;}
  .done-note{font-size:11.5px;color:var(--soft);background:#F4F5F5;border-radius:8px;padding:6px 10px;}
  .acts button .pill{
    position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--sell);color:#fff;
    font-size:9.5px;padding:1px 7px;border-radius:999px;font-weight:700;
  }

  /* ---------- input ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;flex-shrink:0;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;border:1px solid var(--line);background:var(--white);border-radius:999px;
    padding:6px 12px;font-size:11.5px;color:var(--soft);cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .chip:hover{border-color:var(--buy);color:var(--buy);background:var(--buy-soft);}
  .composer{display:flex;gap:8px;padding:10px 14px 13px;flex-shrink:0;}
  .composer input{
    flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 16px;
    font-family:inherit;font-size:13.5px;outline:none;
  }
  .composer input:focus{border-color:var(--buy);}
  .panel.seller .composer input:focus{border-color:var(--sell);}
  .composer button{
    width:38px;height:38px;border-radius:50%;border:none;color:#fff;font-size:15px;cursor:pointer;flex-shrink:0;
  }
  .panel.buyer .composer button{background:var(--buy);}
  .panel.seller .composer button{background:var(--sell);}
  .composer button:disabled{background:#C8CFCC;cursor:not-allowed;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 0;}
  .note{font-size:11.5px;color:var(--soft);}
  .reset{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 14px;
         font-family:inherit;font-size:12.5px;color:var(--soft);cursor:pointer;}
  .reset:hover{border-color:var(--danger);color:var(--danger);}
</style>
</head>
<body>
<div class="wrap">

  <div class="picker-label">เลือกสินค้า (ข้อมูลจริงจาก dataset)</div>
  <select id="productSelect"></select>
  <div class="seller-line" id="sellerLine"></div>

  <div class="panels">
    <div class="panel buyer">
      <div class="panel-head"><span class="dot"></span> มุมมองผู้ซื้อ (คุณ)</div>
      <div class="thread" id="buyerThread"></div>
      <div class="chips" id="buyerChips">
        <div class="chip" data-act="spec">ถามสเปก</div>
        <div class="chip" data-act="trust">ถามความน่าเชื่อถือ</div>
        <div class="chip" data-act="market">เทียบราคาตลาด</div>
        <div class="chip" data-act="lowball">เสนอราคาต่ำ</div>
        <div class="chip" data-act="pii">ขอเบอร์โทร (PII)</div>
      </div>
      <div class="composer">
        <input type="text" id="buyerInput" placeholder="พิมพ์คำถามหรือเสนอราคา...">
        <button id="buyerSend">➤</button>
      </div>
    </div>

    <div class="panel seller">
      <div class="panel-head"><span class="dot"></span> มุมมองผู้ขาย (จำลอง)</div>
      <div class="thread" id="sellerThread"></div>
      <div class="composer">
        <input type="text" id="sellerInput" placeholder="พิมพ์ข้อความในฐานะผู้ขาย...">
        <button id="sellerSend">➤</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="note">AI ช่วยเจรจาต่อรองราคา · ข้อมูลสินค้า/ผู้ขายจาก dataset จริง · ราคาเป็นข้อมูลทดสอบระบบ</div>
    <button class="reset" id="resetBtn">เริ่มการเจรจาใหม่</button>
  </div>
</div>

  const o = document.createElement('option');
  o.value = i;
  o.textContent = `${p.name} — ${baht(listOf(p))} บาท (ผู้ขาย ${p.seller})`;
  selectEl.appendChild(o);
});

/* ---------- เรนเดอร์ ---------- */
const buyerThread = document.getElementById('buyerThread');
const sellerThread = document.getElementById('sellerThread');

function render(){
  [buyerThread, sellerThread].forEach(t => t.innerHTML = '');
  messages.forEach(m => {
    // แผงผู้ซื้อ: โชว์ทุกอย่าง ยกเว้นกล่อง AI ของฝั่งผู้ขาย
    if(m.type !== 'advisor') buyerThread.appendChild(buildNode(m, 'buyer'));
    // แผงผู้ขาย: โชว์ทุกอย่าง ยกเว้นกล่องโค้ชของฝั่งผู้ซื้อ
    if(m.type !== 'coach') sellerThread.appendChild(buildNode(m, 'seller'));
  });
  buyerThread.scrollTop = buyerThread.scrollHeight;
  sellerThread.scrollTop = sellerThread.scrollHeight;
}

function buildNode(m, side){
  if(m.type === 'text'){
    const d = document.createElement('div');
    d.className = 'msg ' + (m.from === 'buyer' ? 'from-buyer' : 'from-seller');
    d.textContent = m.text;
    return d;
  }
  if(m.type === 'card'){
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<span class="tag">ข้อมูลจากคลังสินค้า</span> ${m.title}<br>${m.body}`;
    return d;
  }
  if(m.type === 'coach'){
    const d = document.createElement('div');
    d.className = 'coach';
    d.textContent = '💡 ' + m.text;
    return d;
  }
  if(m.type === 'advisor') return buildAdvisor(m);
  return document.createElement('div');
}

/* กล่อง "AI แนะนำผู้ขาย" — แถบสีบอกว่าข้อเสนออยู่โซนไหนเทียบขั้นต่ำ */
function buildAdvisor(m){
  const d = document.createElement('div');
  d.className = 'advisor';
  const list = listOf(current), floor = floorOf(current);
  const barMin = Math.round(floor * 0.7), barMax = list;
  const pos = Math.max(2, Math.min(98, (m.offer - barMin) / (barMax - barMin) * 100));

  d.innerHTML = `
    <span class="tag">AI แนะนำผู้ขาย</span>
    <div class="nums">
      <div class="num">เสนอ<b>${baht(m.offer)}</b></div>
      <div class="num mid">ขั้นต่ำ (ประมาณ)<b>${baht(floor)}</b></div>
      <div class="num right">ป้าย<b>${baht(list)}</b></div>
    </div>
    <div class="bar"><div class="marker" style="left:${pos}%"></div></div>
    <div class="zones"><span>ต่ำไป</span><span>ใกล้ขั้นต่ำ</span><span>ปิดได้</span></div>
    <div class="verdict">${m.verdict}</div>
    ${m.done
      ? `<div class="done-note">ข้อเสนอนี้ตัดสินใจไปแล้ว (${m.done})</div>`
      : `<div class="acts">
          <button data-a="reject">ปฏิเสธ</button>
          ${m.counter ? `<button class="rec" data-a="counter"><span class="pill">แนะนำ</span>ต่อรอง ${baht(m.counter)}</button>` : ''}
          <button class="primary" data-a="accept">ตกลง</button>
        </div>`}`;

  if(m.done){
    d.classList.add('spent');
  } else {
    d.querySelectorAll('.acts button').forEach(b => {
      b.addEventListener('click', () => sellerDecision(b.dataset.a, m));
    });
  }
  return d;
}

/* ---------- ตรรกะเจรจา ---------- */
function analyzeOffer(offer){
  const floor = floorOf(current), list = listOf(current);
  // ต่อรองที่จุดกึ่งกลางระหว่างข้อเสนอกับขั้นต่ำ ปัดเป็นหลักร้อย
  const counter = Math.round((offer + floor) / 2 / 100) * 100;
  if(offer >= floor * 1.02){
    return { zone:'good', counter:null,
      verdict:`ข้อเสนอสูงกว่าเกณฑ์ขั้นต่ำแล้ว ปิดดีลได้เลย`,
      coach:`ข้อเสนอของคุณอยู่ในเกณฑ์ที่ผู้ขายรับได้แล้ว` };
  }
  if(offer >= floor * 0.85){
    return { zone:'near', counter,
      verdict:`ใกล้เคียงเกณฑ์แล้ว แนะนำต่อรองที่ ${baht(counter)} บาท`,
      coach:`ใกล้จะปิดดีลแล้ว ลองเสนออีกสัก ${baht(counter)} บาทไหม` };
  }
  return { zone:'low', counter,
    verdict:`ต่ำกว่าเกณฑ์ขั้นต่ำค่อนข้างมาก แนะนำต่อรองกลับที่ ${baht(counter)} บาท`,
    coach:`ราคาที่เสนอต่ำกว่าที่ผู้ขายรายนี้มักยอมรับ ลองขยับขึ้นมาที่ ${baht(counter)} บาทดู` };
}

/* ปิดปุ่มของกล่อง AI เก่าทั้งหมด กันกดปิดดีลด้วยราคาที่ไม่ใช่ข้อเสนอล่าสุด */
function retireAdvisors(reason){
  messages.forEach(m => { if(m.type === 'advisor' && !m.done) m.done = reason; });
}

function buyerOffer(offer){
  lastOffer = offer;
  retireAdvisors('มีข้อเสนอใหม่เข้ามา');
  const a = analyzeOffer(offer);
  messages.push({ type:'coach', text:a.coach });
  messages.push({ type:'advisor', offer, verdict:a.verdict, counter:a.counter });
  render();
}

function sellerDecision(action, m){
  const floor = floorOf(current);
  m.done = action === 'accept' ? 'ตกลง' : action === 'counter' ? 'ต่อรองกลับ' : 'ปฏิเสธ';
  retireAdvisors('ปิดการตัดสินใจแล้ว');
  if(action === 'accept'){
    push('seller', `ตกลงครับ ปิดที่ ${baht(m.offer)} บาท เดี๋ยวจัดส่งให้เลยครับ`);
    messages.push({ type:'coach', text:`ปิดดีลสำเร็จที่ ${baht(m.offer)} บาท (ถูกกว่าป้าย ${baht(listOf(current) - m.offer)} บาท)` });
  } else if(action === 'counter'){
    push('seller', `ลองเอาที่ ${baht(m.counter)} บาทดูไหมครับ`);
  } else {
    push('seller', `ขออภัยครับ ราคานี้ต่ำกว่าที่รับได้ ขอผ่านครับ (ขั้นต่ำประมาณ ${baht(floor)} บาท)`);
  }
  render();
}

function push(from, text){ messages.push({ type:'text', from, text }); }

/* ---------- ข้อความผู้ซื้อ ---------- */
function extractPrice(text){
  const m = text.replace(/,/g, '').match(/(\d{3,7})/);
  return m ? parseInt(m[1], 10) : null;
}

function buyerSay(text){
  if(!text.trim()) return;
  push('buyer', text);
  const price = extractPrice(text);
  const wantsDeal = /ลด|ต่อ|เหลือ|ขอ|ได้ไหม|ราคา/.test(text);
  if(price && wantsDeal && price < listOf(current) * 1.2){
    render();
    setTimeout(() => buyerOffer(price), 320);
    return;
  }
  // ไม่ใช่การเสนอราคา → ตอบตามเนื้อหาคำถาม
  setTimeout(() => {
    if(/เบอร์|โทร|ไลน์|line|ที่อยู่|อีเมล|email/i.test(text)) chipAction('pii', true);
    else if(/สเปก|spec|รายละเอียด|สภาพ/i.test(text)) chipAction('spec', true);
    else if(/เชื่อถือ|รีวิว|rating|เรตติ้ง|ร้าน/i.test(text)) chipAction('trust', true);
    else if(/ตลาด|แพง|ถูก|คุ้ม/i.test(text)) chipAction('market', true);
    else { push('seller', 'สนใจสอบถามเรื่องไหนเพิ่มเติมได้เลยครับ หรือจะเสนอราคามาก็ได้ครับ'); render(); }
  }, 320);
  render();
}

/* ---------- ปุ่มลัดผู้ซื้อ ---------- */
function chipAction(act, skipUserMsg){
  const p = current, list = listOf(p), market = marketOf(p), floor = floorOf(p);

  if(act === 'spec'){
    if(!skipUserMsg) push('buyer', 'ขอดูสเปกหน่อยครับ');
    messages.push({ type:'card', title:`<b>${p.name}</b> (${p.cat})`,
      body:`แบรนด์: ${p.brand}<br>สภาพ: ${p.cond}<br>${p.desc ? 'รายละเอียด: ' + p.desc + '<br>' : ''}ราคา: ${baht(list)} บาท` });
  }
  else if(act === 'trust'){
    if(!skipUserMsg) push('buyer', 'ผู้ขายเจ้านี้เชื่อถือได้ไหมครับ');
    messages.push({ type:'card', title:`<b>ผู้ขาย ${p.seller}</b>`,
      body:`คะแนนรีวิว: ⭐ ${p.rating} / 5<br>อัตราการยอมต่อรอง: ${p.negRate}%<br>สรุป: ${p.rating >= 4 ? 'เรตติ้งดี น่าเชื่อถือ' : p.rating >= 3 ? 'เรตติ้งปานกลาง ควรตรวจสอบเพิ่ม' : 'เรตติ้งค่อนข้างต่ำ ควรระมัดระวัง'}` });
  }
  else if(act === 'market'){
    if(!skipUserMsg) push('buyer', 'สินค้านี้แพงไปไหมครับ');
    const cheaper = list < market;
    messages.push({ type:'card', title:`เทียบราคาตลาด: <b>${baht(list)} บาท</b> vs เฉลี่ยตลาด <b>${baht(market)} บาท</b>`,
      body:`สรุป: ${cheaper ? 'ถูกกว่าราคาตลาดเฉลี่ย' : 'สูงกว่าราคาตลาดเฉลี่ย มีช่องให้ต่อรอง'}` });
    messages.push({ type:'coach', text:`ผู้ขายรายนี้มักยอมลดได้ถึงประมาณ ${baht(floor)} บาท ลองเสนอในช่วงนั้นดู` });
  }
  else if(act === 'lowball'){
    const low = Math.round(floor * 0.82 / 100) * 100;
    buyerSay(`ขอ ${low} ได้ไหมครับ`);
    return;
  }
  else if(act === 'pii'){
    if(!skipUserMsg) push('buyer', 'ขอเบอร์โทรหน่อยได้ไหมครับ');
    push('seller', 'ขออภัยครับ ระบบไม่สามารถเปิดเผยข้อมูลส่วนบุคคล เช่น เบอร์โทรศัพท์ อีเมล หรือที่อยู่ ได้ตามนโยบายความเป็นส่วนตัว (BR003) คุยผ่านแชทในระบบได้เลยครับ');
  }
  render();
}

/* ---------- เลือกสินค้า / รีเซ็ต ---------- */
function loadProduct(idx){
  current = PRODUCTS[idx];
  messages = []; lastOffer = null;
  document.getElementById('sellerLine').innerHTML =
    `ผู้ขาย <b>${current.seller}</b> ( ⭐ ${current.rating}, negotiation rate ${current.negRate}% ) → floor ประมาณ <span class="floor">${baht(floorOf(current))} บาท</span>`;
  push('seller', `สวัสดีครับ สนใจ ${current.name} ราคา ${baht(listOf(current))} บาทใช่ไหมครับ`);
  render();
}

selectEl.addEventListener('change', e => loadProduct(parseInt(e.target.value, 10)));
document.getElementById('resetBtn').addEventListener('click', () => loadProduct(parseInt(selectEl.value, 10)));

document.getElementById('buyerChips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if(c) chipAction(c.dataset.act);
});

const buyerInput = document.getElementById('buyerInput');
document.getElementById('buyerSend').addEventListener('click', () => { buyerSay(buyerInput.value); buyerInput.value=''; });
buyerInput.addEventListener('keydown', e => { if(e.key==='Enter'){ buyerSay(buyerInput.value); buyerInput.value=''; } });

const sellerInput = document.getElementById('sellerInput');
function sellerSay(){
  const t = sellerInput.value.trim();
  if(!t) return;
  push('seller', t); sellerInput.value=''; render();
}
document.getElementById('sellerSend').addEventListener('click', sellerSay);
sellerInput.addEventListener('keydown', e => { if(e.key==='Enter') sellerSay(); });

/* เริ่มต้นที่ Sony PlayStation 5 ถ้ามี (ให้ตรงกับตัวอย่างที่ SE รีวิว) */
const startIdx = Math.max(0, PRODUCTS.findIndex(p => p.name === 'Sony PlayStation 5'));
selectEl.value = startIdx;
loadProduct(startIdx);
</script>
